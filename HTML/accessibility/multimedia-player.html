<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multimedia Player</title>
</head>

<body>
  <h1>freeCodeCamp song</h1>
  
  <section>
    <h2>Sailing Away</h2>
    <audio controls aria-label="freeCodeCamp-song"><source src="https://cdn.freecodecamp.org/curriculum/js-music-player/sailing-away.mp3" type="mp3"></source></audio>
  </section>
  
  <section>
    <h2>Map Method</h2>
    <video controls width="350" aria-label><source src="https://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.mp4" type="mp4"></source><track src="https://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.vtt" kind="vtt" srclang="en" label="subtitles">
    </video>
  </section>

  <section>
    <h2>Transcript</h2>
    <p>Lorem ipsum Lorem ipsumLorem ipsumLorem ipsumLorem ipsum</p>
  </section>
</body>

</html>
