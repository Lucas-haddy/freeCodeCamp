<!DOCTYPE html>
<html lang="en">

<head>
    <link href="styles.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="utf-8">
    <title>Styled To-Do List</title>
</head>

<body>
    <div class="todo-box">
    <h1>My To-Do list</h1>
    <ul class="todo-list">
        <li>
            <input type="checkbox" id="chores">
            <label for="chores">Vacuum the house</label>
            <ul class="sub-item">
                <li>
                    <a class="sub-item-link" href="https://www.thewarehouse.co.nz/p/living-co-multi-cyclonic-1400w-vacuum/R2992208.html?srsltid=AfmBOorl3EQv_1aC-sgTRUidUUR49Tjvkv4NZVKxIlPK7wZVRxQwNUwlCuo" target="_blank">A good vacuum</a>
                </li> 
            </ul>
        </li>
        <li>
            <input type="checkbox" id="groceries">
            <label for="groceries">Buy some groceries</label>
            <ul class="sub-item">
                <li>
                    <a href="https://www.woolworths.co.nz/" class="sub-item-link" target="_blank">Online store</a>
                </li>
            </ul>
        </li>
        <li>
            <input type="checkbox" id="exercise">
            <label for="exercise">Do some exercise</label>
            <ul class="sub-item">
                <li>
                    <a href="https://www.cityfitness.co.nz/" class="sub-item-link" target="_blank">Local gym</a>
                </li>
            </ul>
        </li>
        <li>
            <input type="checkbox" id="bedtime">
            <label for="bedtime">Go to bed</label>
            <ul class="sub-item">
                <li>
                    <a href="https://brownies.co.nz/?srsltid=AfmBOopJ_62qZEu8UVYrloaMoQfac6faRkTdKmQ3jBAVJExgesZzo0ms" class="sub-item-link" target="_blank">Good bed</a>
                </li>
            </ul>
        </li>
    </ul>
    </div>
</body>

</html>
