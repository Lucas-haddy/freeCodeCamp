<!DOCTYPE html>
<html lang="en">
<head>
    <link href="styles.css" rel="stylesheet">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Post Card</title>
</head>
<body>
    <div class="blog-post-card">
        <img class="post-img" src="https://cdn.freecodecamp.org/curriculum/labs/cover-photo.jpg" alt="A man writing in a document on a laptop">
        <div class="post-content">
            <h2 class="post-title">Learn to Code!</h2>
            <p class="post-excerpt">
                Learn to Code for free online with freeCodeCamp's online curriculum!
            </p>
            <a class="read-more" href="www.freecodecamp.org" target="_blank">Read More</a>
        </div>
    </div>
</body>
</html>
